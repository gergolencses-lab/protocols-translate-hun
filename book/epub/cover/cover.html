<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Protokollok – borító</title>
<style>
  /* 1600×2560 px borító, az eredeti címoldal (PDF 3. oldal) szórácsos logójának mintájára. */
  @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat.ttf"); font-weight: 100 900; }
  html, body { margin: 0; width: 1600px; height: 2560px; background: #fff; color: #111; }
  body { font-family: "Montserrat", sans-serif; display: flex; flex-direction: column; align-items: center; }
  .logo { margin-top: 520px; display: grid; grid-template-columns: repeat(3, 215px); row-gap: 0; justify-items: center; }
  .logo span { font-size: 300px; font-weight: 800; line-height: 1; letter-spacing: 0; }
  .logo .dot { width: 205px; height: 205px; margin-top: 42px; border-radius: 50%;
               background: radial-gradient(circle, #d4d4d4 0%, #d9d9d9 55%, rgba(217,217,217,.55) 70%, rgba(255,255,255,0) 73%); }
  .logo .last { grid-column: 1 / span 3; display: flex; gap: 0; justify-content: center; }
  .logo .last span { width: 215px; text-align: center; }
  .sub { margin-top: 170px; font-size: 64px; font-weight: 600; letter-spacing: .16em; text-align: center; line-height: 1.45; }
  .author { margin-top: 250px; font-size: 54px; font-weight: 600; letter-spacing: .12em; text-align: center; line-height: 1.5; }
  .author small { display: block; font-size: 42px; font-weight: 500; letter-spacing: .06em; }
</style>
</head>
<body>
  <div class="logo">
    <span>P</span><span>R</span><span>O</span>
    <span>T</span><div class="dot"></div><span>K</span>
    <span>O</span><span>L</span><span>L</span>
    <div class="last"><span>O</span><span>K</span></div>
  </div>
  <div class="sub">HASZNÁLATI ÚTMUTATÓ<br>AZ EMBERI TESTHEZ</div>
  <div class="author">ANDREW D. HUBERMAN, PhD<small>Jessica Wapner közreműködésével</small></div>
</body>
</html>
